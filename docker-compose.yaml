services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: client
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "42069:42069"
    environment:
      - RUST_LOG=info
      - PORT=42069
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: server
